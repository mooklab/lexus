<svg class="dots" viewBox="0 0 1920 1920">
    <defs>

      <!-- градиент -->
      <radialGradient
        id="gradient"
        gradientUnits="userSpaceOnUse"
        preserveAspectRatio="xMidYMid slice"
        cx="50%"
        cy="50%"
        r="30%"
      >
        <stop offset="0%" stop-color="white" stop-opacity="1" />
        <stop offset="100%" stop-color="white" stop-opacity="0" />
      </radialGradient>

      <!-- паттерн точек -->
      <pattern
        id="dotPattern"
        width="60"
        height="60"
        patternUnits="userSpaceOnUse"
      >
        <circle
          cx="30"
          cy="30"
          r="4"
          fill="white"
        />
      </pattern>

      <!-- маска -->
      <mask id="mask">
        <rect
          width="100%"
          height="100%"
          fill="url(#gradient)"
        />
      </mask>

    </defs>

    <!-- сами точки -->
    <rect
      width="100%"
      height="100%"
      fill="url(#dotPattern)"
      mask="url(#mask)"
    />
  </svg>